<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060912;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #bg-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, transparent 0%, #060912 100%);
            pointer-events: none;
        }
        .container {
            display: flex; flex-direction: column; align-items: center; z-index: 1; width: 100%;
        }
        .clock {
            font-size: clamp(64px, 10vw, 120px); font-weight: 200; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        .date {
            font-size: 16px; color: rgba(255,255,255,0.7); margin-top: 8px; margin-bottom: 4px;
        }
        .greeting {
            font-size: 24px; font-weight: 300; color: rgba(255,255,255,0.9); margin-bottom: 40px;
        }
        .search-bar {
            width: min(600px, 85vw); height: 48px; border-radius: 24px;
            background: rgba(8,12,24,0.55);
            border: 1px solid rgba(0,212,255,0.15);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease; margin-bottom: 48px;
        }
        .search-bar:focus-within {
            background: rgba(8,12,24,0.75); border-color: rgba(0,212,255,0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 2px rgba(0,212,255,0.1);
        }
        .search-icon {
            width: 20px; height: 20px; fill: rgba(255,255,255,0.5); margin-right: 12px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: white;
            font-size: 16px; font-family: 'Inter', sans-serif;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.4); }
        .mic-icon {
            width: 20px; height: 20px; fill: rgba(255,255,255,0.5); margin-left: 12px; cursor: pointer;
        }
        .speed-dial {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 800px;
        }
        @media (max-width: 600px) { .speed-dial { grid-template-columns: repeat(2, 1fr); gap: 16px; } }
        .dial-card {
            width: 110px; height: 110px; border-radius: 16px;
            background: rgba(8,12,24,0.55); border: 1px solid rgba(0,212,255,0.15);
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: white; transition: all 0.2s ease;
        }
        .dial-card:hover {
            transform: translateY(-4px); background: rgba(8,12,24,0.7);
            border-color: rgba(0,212,255,0.4); box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 15px rgba(0,212,255,0.1);
        }
        .dial-icon {
            width: 40px; height: 40px; margin-bottom: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); font-size: 20px; font-weight: 500;
        }
        .dial-icon img { width: 100%; height: 100%; border-radius: 8px; object-fit: contain; }
        .dial-name { font-size: 12px; font-weight: 400; opacity: 0.8; }
        .dock {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            height: 48px; border-radius: 24px;
            background: rgba(8,12,24,0.55); border: 1px solid rgba(0,212,255,0.15);
            backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 16px; gap: 16px;
        }
        .dock-item {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; text-decoration: none;
        }
        .dock-item svg { width: 18px; height: 18px; fill: rgba(255,255,255,0.7); }
        .dock-item:hover { background: rgba(255,255,255,0.1); }
        .dock-item:hover svg { fill: white; }
        .wallpaper-picker { position: absolute; top: 20px; right: 20px; }
        .wp-btn {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(8,12,24,0.55);
            border: 1px solid rgba(0,212,255,0.15); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .wp-btn:hover { background: rgba(8,12,24,0.8); }
        .wp-btn svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.7); }
        .wp-menu {
            position: absolute; top: 50px; right: 0; width: 220px; background: rgba(8,12,24,0.85);
            border: 1px solid rgba(0,212,255,0.15); backdrop-filter: blur(24px);
            border-radius: 12px; padding: 16px; display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .wp-menu.show { display: grid; }
        .wp-swatch { width: 100%; aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .wp-swatch:hover { border-color: rgba(255,255,255,0.5); }
        .wp-swatch.active { border-color: #00d4ff; }
        .wp-upload { grid-column: span 3; text-align: center; padding: 8px; font-size: 12px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 6px; margin-top: 8px; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="overlay"></div>
    
    <div class="wallpaper-picker">
        <div class="wp-btn" id="wp-btn" title="Change Background">
            <svg viewBox="0 0 24 24"><path d="M21,19V5C21,3.89 20.1,3 19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19M8.5,13.5L11,16.5L14.5,12L19,18H5L8.5,13.5Z" /></svg>
        </div>
        <div class="wp-menu" id="wp-menu">
            <div class="wp-swatch" style="background: linear-gradient(135deg, #060912, #1a1a2e)" data-bg="gradient-1"></div>
            <div class="wp-swatch" style="background: linear-gradient(135deg, #0f2027, #203a43, #2c5364)" data-bg="gradient-2"></div>
            <div class="wp-swatch" style="background: linear-gradient(135deg, #141e30, #243b55)" data-bg="gradient-3"></div>
            <div class="wp-swatch" style="background: linear-gradient(135deg, #4b134f, #c94b4b)" data-bg="gradient-4"></div>
            <div class="wp-swatch" style="background: linear-gradient(135deg, #000000, #434343)" data-bg="gradient-5"></div>
            <div class="wp-swatch" style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e)" data-bg="gradient-6"></div>
            <div class="wp-upload" id="wp-upload">Upload Image</div>
            <input type="file" id="wp-file" style="display:none" accept="image/*">
        </div>
    </div>

    <div class="container">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date">Monday, January 1</div>
        <div class="greeting" id="greeting">Good Morning, Shiva</div>
        
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
            <input type="text" class="search-input" id="search-input" placeholder="Search Google or type a URL..." autocomplete="off">
            <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z" /></svg>
        </div>

        <div class="speed-dial" id="speed-dial">
            <!-- Populated by JS -->
        </div>
    </div>

    <div class="dock">
        <a href="about:blank" class="dock-item" title="Bookmarks"><svg viewBox="0 0 24 24"><path d="M17,3H7A2,2 0 0,0 5,5V21L12,18L19,21V5A2,2 0 0,0 17,3Z" /></svg></a>
        <a href="about:blank" class="dock-item" title="History"><svg viewBox="0 0 24 24"><path d="M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3" /></svg></a>
        <a href="#" class="dock-item" title="Settings"><svg viewBox="0 0 24 24"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" /></svg></a>
    </div>

    <script>
        // Clock & Date
        function updateTime() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            const ampm = h >= 12 ? 'PM' : 'AM';
            const hr = h % 12 || 12;
            document.getElementById('clock').textContent = `${hr.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

            let greet = 'Evening';
            if (h < 12) greet = 'Morning';
            else if (h < 17) greet = 'Afternoon';
            document.getElementById('greeting').textContent = `Good ${greet}, Shiva`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Search
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = searchInput.value.trim();
                if (!val) return;
                if (/^(https?:\/\/|[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,5}(:[0-9]{1,5})?(\/.*)?$)/i.test(val)) {
                    let url = val;
                    if (!url.startsWith('http')) url = 'https://' + url;
                    window.location.href = url;
                } else {
                    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                }
            }
        });
        searchInput.focus();

        // Speed Dial
        const dials = [
            { name: 'Google', url: 'https://www.google.com', domain: 'google.com' },
            { name: 'YouTube', url: 'https://www.youtube.com', domain: 'youtube.com' },
            { name: 'GitHub', url: 'https://github.com', domain: 'github.com' },
            { name: 'Gmail', url: 'https://mail.google.com', domain: 'google.com' },
            { name: 'Reddit', url: 'https://www.reddit.com', domain: 'reddit.com' },
            { name: 'X', url: 'https://x.com', domain: 'x.com' },
            { name: 'Wikipedia', url: 'https://www.wikipedia.org', domain: 'wikipedia.org' },
            { name: 'ChatGPT', url: 'https://chatgpt.com', domain: 'chatgpt.com' }
        ];
        
        const dialContainer = document.getElementById('speed-dial');
        dials.forEach(d => {
            const a = document.createElement('a');
            a.href = d.url;
            a.className = 'dial-card';
            const firstLetter = d.name.charAt(0);
            const favUrl = `https://www.google.com/s2/favicons?domain=${d.domain}&sz=64`;
            a.innerHTML = `
                <div class="dial-icon">
                    <img src="${favUrl}" alt="${firstLetter}" onerror="this.style.display='none'; this.parentElement.innerText='${firstLetter}'" />
                </div>
                <div class="dial-name">${d.name}</div>
            `;
            dialContainer.appendChild(a);
        });

        // Wallpaper Picker
        const wpBtn = document.getElementById('wp-btn');
        const wpMenu = document.getElementById('wp-menu');
        const wpFile = document.getElementById('wp-file');
        const wpUpload = document.getElementById('wp-upload');
        const overlay = document.getElementById('overlay');
        const canvas = document.getElementById('bg-canvas');

        wpBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            wpMenu.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!wpMenu.contains(e.target) && !wpBtn.contains(e.target)) {
                wpMenu.classList.remove('show');
            }
        });

        function setBg(type, val) {
            if (type === 'gradient') {
                document.body.style.backgroundImage = val;
                document.body.style.backgroundSize = 'cover';
                canvas.style.opacity = '0.3'; 
            } else if (type === 'image') {
                document.body.style.backgroundImage = `url(${val})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                canvas.style.opacity = '0';
            } else {
                document.body.style.backgroundImage = '';
                canvas.style.opacity = '1';
            }
            localStorage.setItem('black_nt_bg_type', type);
            localStorage.setItem('black_nt_bg_val', val);
        }

        document.querySelectorAll('.wp-swatch').forEach(sw => {
            sw.addEventListener('click', () => {
                setBg('gradient', sw.style.background);
                wpMenu.classList.remove('show');
            });
        });

        wpUpload.addEventListener('click', () => wpFile.click());
        wpFile.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setBg('image', ev.target.result);
                    wpMenu.classList.remove('show');
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // Init BG
        const savedType = localStorage.getItem('black_nt_bg_type');
        const savedVal = localStorage.getItem('black_nt_bg_val');
        if (savedType && savedVal) {
            setBg(savedType, savedVal);
        }

        // Animated Canvas Mesh
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 212, 255, 0.5)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 212, 255, ${0.15 - dist/1000})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
