<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab — Black Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #00f0ff;
      --accent-dim: rgba(0, 240, 255, 0.6);
      --accent-faint: rgba(0, 240, 255, 0.12);
      --glass-bg: rgba(5, 14, 28, 0.55);
      --glass-border: rgba(0, 240, 255, 0.18);
      --glass-hover: rgba(0, 240, 255, 0.09);
      --text: #f0f9ff;
      --text-dim: #7dd3fc;
      --text-muted: #0284c7;
      --font-cinzel: 'Cinzel', serif;
      --font-inter: 'Inter', system-ui, sans-serif;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --wallpaper: none;
    }

    /* ══════════════════════════════════════
       BACKGROUND SYSTEM
    ══════════════════════════════════════ */
    body {
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-inter);
      color: var(--text);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Mesh animated background */
    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 100% 100%, rgba(0, 82, 155, 0.15) 0%, transparent 55%),
        radial-gradient(ellipse 60% 80% at 0% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        linear-gradient(160deg, #02050b 0%, #040c1a 40%, #060d1f 70%, #02050b 100%);
      background-attachment: fixed;
    }

    /* Wallpaper overlay */
    #wallpaper-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #wallpaper-layer.active {
      opacity: 1;
    }
    /* Dark tint over wallpaper */
    #wallpaper-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(2, 5, 11, 0.62);
    }

    /* Animated mesh lines */
    #mesh-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0.35;
      pointer-events: none;
    }

    /* Runic particles */
    .runic-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      font-family: var(--font-cinzel);
      color: rgba(0, 240, 255, 0.18);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      will-change: transform, opacity;
      animation: runicDrift var(--dur, 14s) linear infinite;
      animation-delay: var(--delay, 0s);
      user-select: none;
    }
    @keyframes runicDrift {
      0%   { transform: translateY(110vh) rotate(0deg) scale(0.7); opacity: 0; }
      15%  { opacity: 0.7; }
      85%  { opacity: 0.5; }
      100% { transform: translateY(-15vh) rotate(60deg) scale(1.2); opacity: 0; }
    }

    /* ══════════════════════════════════════
       MAIN LAYOUT
    ══════════════════════════════════════ */
    #page {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* ══════════════════════════════════════
       GLASS PANEL MIXIN
    ══════════════════════════════════════ */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(0, 240, 255, 0.12),
        inset 0 0 40px rgba(0, 240, 255, 0.03);
      transition: all 0.22s var(--ease-spring);
    }

    /* ══════════════════════════════════════
       TOP ROW: CLOCK + WEATHER
    ══════════════════════════════════════ */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 16px;
    }

    /* CLOCK GLASS PANEL */
    .clock-panel {
      flex: 1;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-width: 280px;
    }

    .digital-clock {
      font-family: var(--font-cinzel);
      font-size: clamp(42px, 5vw, 72px);
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.05em;
      line-height: 1;
      text-shadow:
        0 0 20px rgba(0, 240, 255, 0.7),
        0 0 60px rgba(0, 240, 255, 0.25);
      animation: clockPulse 2s ease-in-out infinite alternate;
    }
    @keyframes clockPulse {
      from { text-shadow: 0 0 20px rgba(0,240,255,0.7), 0 0 60px rgba(0,240,255,0.25); }
      to   { text-shadow: 0 0 28px rgba(0,240,255,0.9), 0 0 80px rgba(0,240,255,0.4); }
    }

    .clock-date {
      font-size: 14px;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .clock-greeting {
      font-family: var(--font-cinzel);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* WEATHER GLASS PANEL */
    .weather-panel {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 140px;
    }
    .weather-icon {
      font-size: 36px;
      filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5));
    }
    .weather-temp {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }
    .weather-desc {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
    }

    /* ══════════════════════════════════════
       SEARCH BOX
    ══════════════════════════════════════ */
    .search-wrapper {
      width: 100%;
      max-width: 680px;
    }

    .search-glass {
      width: 100%;
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 16px 0 20px;
      gap: 12px;
      border-radius: 27px;
      border: 1.5px solid rgba(0, 240, 255, 0.22);
      background: rgba(5, 14, 28, 0.7);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(0, 240, 255, 0.15);
      transition: all 0.25s var(--ease-spring);
    }
    .search-glass:focus-within {
      border-color: var(--accent);
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(0, 240, 255, 0.3),
        inset 0 1px 0 rgba(0, 240, 255, 0.2),
        0 0 30px rgba(0, 240, 255, 0.12);
      transform: translateY(-1px);
    }

    .search-rune {
      font-family: var(--font-cinzel);
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
      flex-shrink: 0;
      user-select: none;
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-inter);
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
      caret-color: var(--accent);
    }
    #search-input::placeholder {
      color: rgba(0, 240, 255, 0.35);
    }

    .engine-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-inter);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    .engine-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }
    .engine-btn .material-icons-round { font-size: 14px; }

    /* ══════════════════════════════════════
       SPEED DIALS — GLASS GRID
    ══════════════════════════════════════ */
    .dials-section {
      width: 100%;
    }
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(0,240,255,0.2), transparent);
    }

    .speed-dial-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 12px;
    }

    .sd-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 8px 12px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      background: rgba(5, 14, 28, 0.55);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(0, 240, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.22s var(--ease-spring);
      cursor: pointer;
      will-change: transform;
    }
    .sd-card:hover {
      background: rgba(0, 240, 255, 0.08);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(0, 240, 255, 0.2),
        inset 0 1px 0 rgba(0, 240, 255, 0.2);
      transform: translateY(-4px) scale(1.04);
    }
    .sd-card:active { transform: translateY(-1px) scale(1.01); }

    .sd-icon-ring {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .sd-card:hover .sd-icon-ring {
      border-color: rgba(0, 240, 255, 0.45);
    }
    .sd-icon-ring img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }
    .sd-icon-ring .fallback-letter {
      font-family: var(--font-cinzel);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .sd-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
      transition: color 0.2s;
    }
    .sd-card:hover .sd-label { color: var(--accent); }

    /* Add dial button */
    .sd-add-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 8px 12px;
      border-radius: 16px;
      border: 1px dashed rgba(0, 240, 255, 0.2);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.22s var(--ease-spring);
      font-family: var(--font-inter);
      font-size: 10px;
    }
    .sd-add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 240, 255, 0.05);
    }
    .sd-add-btn .material-icons-round { font-size: 22px; }

    /* ══════════════════════════════════════
       QUICK LINKS ROW
    ══════════════════════════════════════ */
    .quick-links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ql-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      background: rgba(5, 14, 28, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.18s var(--ease-spring);
      will-change: transform;
    }
    .ql-pill:hover {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
      transform: translateY(-2px);
    }
    .ql-pill .material-icons-round { font-size: 13px; }

    /* ══════════════════════════════════════
       BOTTOM BAR
    ══════════════════════════════════════ */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 20px;
      background: rgba(2, 5, 11, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 240, 255, 0.08);
      font-size: 11px;
      color: var(--text-muted);
    }
    .bottom-bar .brand {
      font-family: var(--font-cinzel);
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ══════════════════════════════════════
       WALLPAPER PICKER BUTTON
    ══════════════════════════════════════ */
    .wp-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 10px;
      font-family: var(--font-inter);
      cursor: pointer;
      transition: all 0.15s;
    }
    .wp-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 240, 255, 0.07);
    }
    .wp-btn .material-icons-round { font-size: 13px; }

    /* ══════════════════════════════════════
       WALLPAPER PICKER PANEL
    ══════════════════════════════════════ */
    #wp-panel {
      position: fixed;
      bottom: 44px;
      right: 16px;
      z-index: 9999;
      padding: 16px;
      border-radius: 18px;
      width: 280px;
      display: none;
    }
    #wp-panel.open { display: block; }
    #wp-panel h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }
    .wp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .wp-thumb {
      aspect-ratio: 16/9;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
    }
    .wp-thumb:hover { border-color: var(--accent); transform: scale(1.04); }
    .wp-thumb.active { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,240,255,0.4); }
    .wp-thumb.none-thumb {
      background: linear-gradient(135deg, #02050b, #040c1a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ══════════════════════════════════════
       CUSTOM SCROLLBAR
    ══════════════════════════════════════ */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 2px; }

    /* ══════════════════════════════════════
       FADE IN ANIMATION
    ══════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .clock-panel   { animation: fadeUp 0.5s var(--ease-spring) both; }
    .weather-panel { animation: fadeUp 0.5s 0.1s var(--ease-spring) both; }
    .search-wrapper{ animation: fadeUp 0.5s 0.15s var(--ease-spring) both; }
    .dials-section { animation: fadeUp 0.5s 0.2s var(--ease-spring) both; }
    .ql-section    { animation: fadeUp 0.5s 0.25s var(--ease-spring) both; }
  </style>
</head>
<body>

  <!-- Background Layers -->
  <div id="bg-layer"></div>
  <div id="wallpaper-layer"></div>
  <canvas id="mesh-canvas"></canvas>
  <div class="runic-particles" id="particles-container"></div>

  <!-- Main Content -->
  <div id="page">

    <!-- Top Row: Clock + Weather -->
    <div class="top-row">
      <div class="glass clock-panel">
        <div class="digital-clock" id="clock">00:00:00</div>
        <div class="clock-date" id="date-display">Saturday, August 1</div>
        <div class="clock-greeting" id="greeting">Good Evening, Phantom</div>
      </div>

      <div class="glass weather-panel">
        <div class="weather-icon" id="weather-icon">🌙</div>
        <div class="weather-temp" id="weather-temp">—</div>
        <div class="weather-desc" id="weather-desc">Black Night</div>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <form class="search-glass" id="search-form" autocomplete="off">
        <span class="search-rune">ᚠ</span>
        <input type="text" id="search-input" placeholder="Search the Abyss or enter URL..." autofocus>
        <button type="button" class="engine-btn" id="engine-btn">
          <span id="engine-name">Google</span>
          <span class="material-icons-round">expand_more</span>
        </button>
      </form>
    </div>

    <!-- Speed Dials -->
    <div class="dials-section">
      <div class="section-label">Speed Dials</div>
      <div class="speed-dial-grid" id="speed-dials"></div>
    </div>

    <!-- Quick Links -->
    <div class="dials-section ql-section">
      <div class="section-label">Quick Links</div>
      <div class="quick-links-row" id="quick-links"></div>
    </div>

  </div>

  <!-- Wallpaper Picker -->
  <div id="wp-panel" class="glass">
    <h4>Background</h4>
    <div class="wp-grid" id="wp-grid"></div>
  </div>

  <!-- Bottom Status Bar -->
  <div class="bottom-bar">
    <span id="stats-display">Tabs Open: 1 | Session: Active</span>
    <span class="brand">ᚲ Black Browser v1.0.0</span>
    <button class="wp-btn" id="wp-toggle-btn">
      <span class="material-icons-round">wallpaper</span>
      Wallpaper
    </button>
  </div>

  <script>
  // ═══════════════════════════════════════
  //  LIVE CLOCK & DATE & GREETING
  // ═══════════════════════════════════════
  function updateClock() {
    const now = new Date();
    const H = String(now.getHours()).padStart(2,'0');
    const M = String(now.getMinutes()).padStart(2,'0');
    const S = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${H}:${M}:${S}`;

    const h = now.getHours();
    let g = 'Good Evening, Phantom';
    if (h < 5)  g = 'Good Night, Shadow';
    else if (h < 12) g = 'Good Morning, Sovereign';
    else if (h < 17) g = 'Good Afternoon, Wanderer';
    document.getElementById('greeting').textContent = g;

    const opts = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
    document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', opts);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ═══════════════════════════════════════
  //  TAB STATS
  // ═══════════════════════════════════════
  function updateTabStats() {
    const count = localStorage.getItem('bb-tab-count') || 1;
    const el = document.getElementById('stats-display');
    if (el) el.textContent = `Tabs Open: ${count} | Session: Active`;
  }
  updateTabStats();
  window.addEventListener('storage', updateTabStats);

  // ═══════════════════════════════════════
  //  WEATHER (time-based icons)
  // ═══════════════════════════════════════
  function setWeatherByTime() {
    const h = new Date().getHours();
    const iconEl = document.getElementById('weather-icon');
    const descEl = document.getElementById('weather-desc');
    const tempEl = document.getElementById('weather-temp');
    const presets = [
      { range: [0, 5],  icon: '🌑', temp: '—',  desc: 'Deep Night' },
      { range: [5, 7],  icon: '🌅', temp: '—',  desc: 'Dawn Rising' },
      { range: [7, 12], icon: '☀️', temp: '—',  desc: 'Morning Light' },
      { range: [12,17], icon: '🌤️', temp: '—', desc: 'Clear Day' },
      { range: [17,20], icon: '🌇', temp: '—',  desc: 'Dusk Falls' },
      { range: [20,24], icon: '🌙', temp: '—',  desc: 'Black Night' },
    ];
    const p = presets.find(p => h >= p.range[0] && h < p.range[1]) || presets[5];
    if (iconEl) iconEl.textContent = p.icon;
    if (descEl) descEl.textContent = p.desc;
    if (tempEl) tempEl.textContent = p.temp;

    // Try browser geolocation weather API (open, no key)
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude, longitude} = pos.coords;
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`)
          .then(r => r.json())
          .then(data => {
            const wc = data.current_weather;
            if (!wc) return;
            const t = Math.round(wc.temperature);
            if (tempEl) tempEl.textContent = `${t}°C`;
            // WMO weather code icons
            const code = wc.weathercode;
            let icon = '☀️';
            if (code >= 1 && code <= 3) icon = '⛅';
            else if (code >= 45 && code <= 48) icon = '🌫️';
            else if (code >= 51 && code <= 67) icon = '🌧️';
            else if (code >= 71 && code <= 77) icon = '❄️';
            else if (code >= 80 && code <= 82) icon = '🌦️';
            else if (code >= 95) icon = '⛈️';
            if (iconEl) iconEl.textContent = icon;
          }).catch(() => {});
      }, () => {});
    }
  }
  setWeatherByTime();

  // ═══════════════════════════════════════
  //  SEARCH ENGINE
  // ═══════════════════════════════════════
  let engineIdx = 0;
  const engines = [
    { name: 'Google',     url: 'https://www.google.com/search?q=' },
    { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
    { name: 'Bing',       url: 'https://www.bing.com/search?q=' },
    { name: 'Brave',      url: 'https://search.brave.com/search?q=' },
    { name: 'Ecosia',     url: 'https://www.ecosia.org/search?q=' },
  ];
  document.getElementById('engine-btn').addEventListener('click', () => {
    engineIdx = (engineIdx + 1) % engines.length;
    document.getElementById('engine-name').textContent = engines[engineIdx].name;
  });
  document.getElementById('search-form').addEventListener('submit', e => {
    e.preventDefault();
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    if (/^https?:\/\//.test(q)) { location.href = q; return; }
    if (/^[\w-]+(\.[a-z]{2,})+$/.test(q)) { location.href = 'https://' + q; return; }
    location.href = engines[engineIdx].url + encodeURIComponent(q);
  });

  // ═══════════════════════════════════════
  //  SPEED DIALS
  // ═══════════════════════════════════════
  const DIALS = [
    { name: 'Google',     url: 'https://www.google.com',    icon: 'https://www.google.com/favicon.ico' },
    { name: 'YouTube',    url: 'https://www.youtube.com',   icon: 'https://www.youtube.com/favicon.ico' },
    { name: 'GitHub',     url: 'https://github.com',        icon: 'https://github.com/favicon.ico' },
    { name: 'Reddit',     url: 'https://www.reddit.com',    icon: 'https://www.reddit.com/favicon.ico' },
    { name: 'ChatGPT',    url: 'https://chatgpt.com',       icon: 'https://chatgpt.com/favicon.ico' },
    { name: 'Claude AI',  url: 'https://claude.ai',         icon: 'https://claude.ai/favicon.ico' },
    { name: 'Amazon',     url: 'https://www.amazon.com',    icon: 'https://www.amazon.com/favicon.ico' },
    { name: 'Wikipedia',  url: 'https://www.wikipedia.org', icon: 'https://www.wikipedia.org/favicon.ico' },
  ];

  const sdContainer = document.getElementById('speed-dials');
  DIALS.forEach(sd => {
    const a = document.createElement('a');
    a.className = 'sd-card';
    a.href = sd.url;

    const ring = document.createElement('div');
    ring.className = 'sd-icon-ring';

    const img = document.createElement('img');
    img.setAttribute('loading', 'lazy');
    img.setAttribute('data-src', sd.icon);
    img.alt = '';
    img.onerror = function() {
      this.style.display = 'none';
      const fb = document.createElement('span');
      fb.className = 'fallback-letter';
      fb.textContent = sd.name.charAt(0);
      ring.appendChild(fb);
    };
    ring.appendChild(img);

    const label = document.createElement('div');
    label.className = 'sd-label';
    label.textContent = sd.name;

    a.appendChild(ring);
    a.appendChild(label);
    sdContainer.appendChild(a);
  });

  // Add button
  const addBtn = document.createElement('div');
  addBtn.className = 'sd-add-btn';
  addBtn.innerHTML = '<span class="material-icons-round">add</span><span>Add</span>';
  sdContainer.appendChild(addBtn);

  // IntersectionObserver lazy favicon load
  const sdObserver = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const img = entry.target.querySelector('img[data-src]');
      if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
      obs.unobserve(entry.target);
    });
  }, { rootMargin: '80px' });
  document.querySelectorAll('.sd-card').forEach(c => sdObserver.observe(c));

  // ═══════════════════════════════════════
  //  QUICK LINKS
  // ═══════════════════════════════════════
  const LINKS = [
    { name: 'FMHY',             url: 'https://fmhy.net',              icon: 'redeem' },
    { name: 'AlternativeTo',    url: 'https://alternativeto.net',     icon: 'swap_horiz' },
    { name: 'Open Library',     url: 'https://openlibrary.org',       icon: 'auto_stories' },
    { name: 'Proton VPN',       url: 'https://protonvpn.com',         icon: 'vpn_lock' },
    { name: 'Gutenberg',        url: 'https://www.gutenberg.org',     icon: 'menu_book' },
    { name: 'Archive.org',      url: 'https://archive.org',           icon: 'archive' },
    { name: 'MDN Docs',         url: 'https://developer.mozilla.org', icon: 'code' },
    { name: 'HackerNews',       url: 'https://news.ycombinator.com',  icon: 'trending_up' },
  ];
  const qlContainer = document.getElementById('quick-links');
  LINKS.forEach(l => {
    const a = document.createElement('a');
    a.className = 'ql-pill';
    a.href = l.url;
    a.innerHTML = `<span class="material-icons-round">${l.icon}</span>${l.name}`;
    qlContainer.appendChild(a);
  });

  // ═══════════════════════════════════════
  //  RUNIC PARTICLES
  // ═══════════════════════════════════════
  const RUNES = ['ᛉ','ᚠ','ᚲ','ᛟ','ᚱ','ᚦ','ᛏ','ᛗ'];
  const pc = document.getElementById('particles-container');
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = RUNES[Math.floor(Math.random() * RUNES.length)];
    p.style.setProperty('--dur', (10 + Math.random() * 10) + 's');
    p.style.setProperty('--delay', (Math.random() * 14) + 's');
    p.style.left = Math.random() * 100 + '%';
    p.style.fontSize = (11 + Math.random() * 14) + 'px';
    pc.appendChild(p);
  }

  // ═══════════════════════════════════════
  //  ANIMATED MESH LINES (Canvas)
  // ═══════════════════════════════════════
  (function meshCanvas() {
    const canvas = document.getElementById('mesh-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, nodes = [];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initNodes(n = 40) {
      nodes = [];
      for (let i = 0; i < n; i++) {
        nodes.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const dist = 140;
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        a.x += a.vx; a.y += a.vy;
        if (a.x < 0 || a.x > W) a.vx *= -1;
        if (a.y < 0 || a.y > H) a.vy *= -1;
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < dist) {
            const alpha = (1 - d / dist) * 0.25;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
        // Node dot
        ctx.beginPath();
        ctx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', () => { resize(); initNodes(); });
    resize(); initNodes(); draw();
  })();

  // ═══════════════════════════════════════
  //  WALLPAPER PICKER
  // ═══════════════════════════════════════
  const WALLPAPERS = [
    { label: 'None', url: null },
    { label: 'Aurora', url: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1920&q=80' },
    { label: 'Galaxy', url: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80' },
    { label: 'Neon City', url: 'https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=1920&q=80' },
    { label: 'Mountains', url: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80' },
    { label: 'Abstract', url: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1920&q=80' },
  ];

  const wpLayer = document.getElementById('wallpaper-layer');
  const wpPanel = document.getElementById('wp-panel');
  const wpGrid  = document.getElementById('wp-grid');
  let currentWP = localStorage.getItem('bb-wallpaper') || null;

  function applyWallpaper(url) {
    currentWP = url;
    if (url) {
      wpLayer.style.backgroundImage = `url('${url}')`;
      wpLayer.classList.add('active');
    } else {
      wpLayer.classList.remove('active');
      wpLayer.style.backgroundImage = 'none';
    }
    localStorage.setItem('bb-wallpaper', url || '');
    document.querySelectorAll('.wp-thumb').forEach(t => {
      t.classList.toggle('active', t.dataset.url === (url || ''));
    });
  }

  WALLPAPERS.forEach(wp => {
    const thumb = document.createElement('div');
    thumb.className = 'wp-thumb' + (wp.url === null ? ' none-thumb' : '');
    thumb.dataset.url = wp.url || '';
    if (wp.url) {
      thumb.style.backgroundImage = `url('${wp.url}')`;
      thumb.style.backgroundSize = 'cover';
      thumb.style.backgroundPosition = 'center';
    } else {
      thumb.textContent = 'None';
    }
    if ((wp.url || '') === (currentWP || '')) thumb.classList.add('active');
    thumb.addEventListener('click', () => applyWallpaper(wp.url));
    wpGrid.appendChild(thumb);
  });

  // Restore on load
  if (currentWP) applyWallpaper(currentWP);

  document.getElementById('wp-toggle-btn').addEventListener('click', e => {
    e.stopPropagation();
    wpPanel.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#wp-panel') && !e.target.closest('#wp-toggle-btn')) {
      wpPanel.classList.remove('open');
    }
  });
  </script>
</body>
