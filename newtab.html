<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>New Tab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap');
        :root {
            --accent: #0060df;
            --dim: 0.28;
            --glass-blur: 16px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --nt-font: 1;
            --nt-tab: 1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: #121216; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea { user-select: text; -webkit-user-select: text; }
        button { font-family: inherit; }

        #bg {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(160deg, #121216 0%, #17171c 100%);
            background-size: cover; background-position: center;
            transition: opacity 0.35s ease;
        }
        #bg-tint {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(120% 120% at 50% 38%, transparent 42%, rgba(18,18,22,0.55) 100%),
                rgba(18,18,22,var(--dim));
        }
        #aurora {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            opacity: 0; transition: opacity 0.5s ease; will-change: transform;
            background:
                radial-gradient(40% 35% at 18% 14%, rgba(0,96,223,0.16), transparent 70%),
                radial-gradient(45% 40% at 82% 86%, rgba(124,108,246,0.14), transparent 70%),
                radial-gradient(30% 26% at 62% 4%, rgba(0,96,223,0.1), transparent 70%);
        }
        body.aurora #aurora { opacity: 0.75; animation: auroraDrift 26s ease-in-out infinite alternate; }
        @keyframes auroraDrift {
            from { transform: translate3d(-2%, -1%, 0) scale(1); }
            to   { transform: translate3d(2%, 1.5%, 0) scale(1.05); }
        }
        @media (prefers-reduced-motion: reduce) {
            body.aurora #aurora { animation: none; opacity: 0.4; }
        }

        .glass {
            background: rgba(10,16,30,0.52);
            backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
            border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
            box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        body.aurora .glass {
            backdrop-filter: none; -webkit-backdrop-filter: none;
            background: rgba(10,16,30,0.86);
        }

        /* Page scrolls when content is tall, stays top-aligned when short */
        #content {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start;
            height: 100vh; width: 100%;
            padding: 24px 24px 128px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        #content::-webkit-scrollbar { width: 6px; }
        #content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
        #content > * { flex: none; }

        /* Hero — Brave-style: big elegant clock, greeting below */
        .hero { text-align: center; }
        .clock {
            display: flex; align-items: baseline; justify-content: center; gap: 14px;
            font-size: clamp(64px, 9vw, 118px); font-weight: 100; line-height: 1;
            letter-spacing: -0.03em; text-shadow: 0 6px 40px rgba(0,0,0,0.5);
        }
        .ampm { font-size: clamp(18px, 2.2vw, 30px); font-weight: 300; color: var(--accent); }
        .date {
            margin-top: 16px; font-size: clamp(12px, 1.4vw, 14px); font-weight: 500;
            letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.5);
        }
        .greeting {
            margin-top: 8px; font-size: clamp(18px, 2.4vw, 26px); font-weight: 300;
            color: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .name-edit {
            background: transparent; border: none; cursor: pointer;
            color: rgba(255,255,255,0.35); font-size: 0.62em; line-height: 1;
            opacity: 0; transition: opacity 0.2s, color 0.2s;
        }
        .greeting:hover .name-edit { opacity: 1; }
        .name-edit:hover { color: var(--accent); }
        .greeting input {
            background: rgba(255,255,255,0.07); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            border-radius: 10px; padding: 4px 12px; font-size: 0.78em; font-weight: 400;
            color: #fff; outline: none; text-align: center; width: 15ch;
        }

        .search-bar {
            width: min(640px, 92vw); height: 52px; border-radius: 999px;
            display: flex; align-items: center; gap: 12px; padding: 0 8px 0 20px;
            margin-top: 26px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }
        .search-bar:focus-within {
            transform: translateY(-1px);
            border-color: color-mix(in srgb, var(--accent) 60%, transparent);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .search-icon { width: 20px; height: 20px; flex: none; fill: rgba(255,255,255,0.55); }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: #fff;
            font-size: 16px; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.38); }
        .search-kbd {
            flex: none; height: 26px; min-width: 26px; padding: 0 9px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.55); font-size: 12px; font-weight: 600;
        }

        /* Quick Access — Chrome/Brave style: circular tiles floating on the
           background (no card box), one centered row */
        #dials-wrap { margin-top: 30px; display: flex; justify-content: center; }
        .speed-dial {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 22px 18px; max-width: 940px;
        }
        .dial-card {
            width: 88px; display: flex; flex-direction: column; align-items: center; gap: 10px;
            text-decoration: none; color: #fff; cursor: pointer; position: relative;
            min-width: 0;
        }
        .dial-card:focus { outline: none; }
        .dial-tile { position: relative; width: calc(64px * var(--nt-tab)); height: calc(64px * var(--nt-tab)); flex: none; }
        .dial-favicon-wrap {
            width: calc(64px * var(--nt-tab)); height: calc(64px * var(--nt-tab)); border-radius: 50%; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: rgba(4, 7, 13, 0.72); overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }
        .dial-card:hover .dial-favicon-wrap {
            transform: translateY(-3px);
            border-color: color-mix(in srgb, var(--accent) 65%, transparent);
            background: rgba(8, 13, 22, 0.85);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5), 0 0 12px color-mix(in srgb, var(--accent) 25%, transparent);
        }
        .dial-letter {
            position: absolute; font-size: calc(26px * var(--nt-tab)); font-weight: 600; color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 10px color-mix(in srgb, var(--accent) 45%, transparent);
        }
        .dial-favicon-wrap img {
            position: absolute; width: 100%; height: 100%; object-fit: cover;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7));
        }
        .dial-name {
            font-size: calc(12px * var(--nt-font)); font-weight: 500; color: rgba(255, 255, 255, 0.92);
            max-width: 100%; padding: 0 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .dial-actions {
            position: absolute; top: -7px; right: -7px; display: flex; gap: 4px;
            opacity: 0; transition: opacity 0.15s ease; z-index: 3;
        }
        .dial-card:hover .dial-actions { opacity: 1; }
        .dial-btn {
            width: 23px; height: 23px; border-radius: 50%; cursor: pointer;
            background: rgba(23,23,28,0.85); border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.85); font-size: 11px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s, color 0.15s;
        }
        .dial-btn:hover { border-color: var(--accent); color: var(--accent); }
        .dial-btn.rm-pending { border-color: #ff6b81; color: #ff6b81; }

        .dial-card.dragging { opacity: 0.35; }
        .dial-card.drop-target .dial-favicon-wrap {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
        }

        .dial-add { cursor: pointer; }
        .dial-add .dial-favicon-wrap {
            border-style: dashed; border-color: rgba(255,255,255,0.22);
            background: rgba(10,16,30,0.3);
        }
        .dial-add .dial-favicon-wrap span { font-size: calc(30px * var(--nt-tab)); font-weight: 300; line-height: 1; color: rgba(255,255,255,0.75); text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .dial-add:hover .dial-favicon-wrap { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
        .dial-add:hover .dial-favicon-wrap span { color: var(--accent); }

        /* Hidden Gems — Firefox-style slim row under the dials */
        #gems-wrap { margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .gems-label {
            font-size: 10.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }
        .gems-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 22px; max-width: 860px; }
        .gem-card { width: 70px; gap: 8px; }
        .gem-card .dial-tile { width: calc(46px * var(--nt-tab)); height: calc(46px * var(--nt-tab)); }
        .gem-card .dial-favicon-wrap { width: calc(46px * var(--nt-tab)); height: calc(46px * var(--nt-tab)); }
        .gem-card .dial-name { font-size: calc(10.5px * var(--nt-font)); color: rgba(255,255,255,0.82); text-shadow: 0 1px 2px rgba(0,0,0,0.85); }

        /* Module cards — Edge/Firefox style: quiet glass cards at the bottom */
        #widgets-row {
            margin-top: 30px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
            gap: 14px; width: min(1080px, 100%);
        }
        .widget {
            flex: 1 1 300px; max-width: 420px;
            border-radius: 18px; padding: 15px 17px;
            display: flex; flex-direction: column; gap: 11px; min-width: 0;
        }
        .widget-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .widget-title {
            font-size: calc(11px * var(--nt-font)); font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
            color: rgba(255,255,255,0.45);
        }
        .widget-btn {
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer; flex: none;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
            color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s, color 0.15s;
        }
        .widget-btn:hover { border-color: var(--accent); color: var(--accent); }
        .widget.no-data { display: none !important; }

        body.widget-off-quote #quote-card,
        body.widget-off-dials #dials-wrap,
        body.widget-off-gems #gems-wrap,
        body.widget-off-continue #continue-card,
        body.widget-off-notes #notes-card { display: none; }

        .quote-text {
            font-size: clamp(13px, 1.3vw, 14.5px); font-weight: 300;
            color: rgba(255,255,255,0.82); line-height: 1.55;
            cursor: pointer;
        }
        .quote-text:hover { color: rgba(255,255,255,0.95); }
        .quote-author { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.45); font-weight: 400; }

        .continue-list { display: flex; flex-direction: column; gap: 2px; }
        .cont-row {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 8px; border-radius: 10px;
            cursor: pointer; text-decoration: none; color: #fff;
            transition: background-color 0.15s;
        }
        .cont-row:hover { background: rgba(255,255,255,0.07); }
        .cont-fav {
            width: 26px; height: 26px; border-radius: 8px; flex: none;
            background: rgba(255,255,255,0.08); position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .cont-fav img { position: absolute; width: 100%; height: 100%; object-fit: contain; }
        .cont-fav .dial-letter { font-size: 13px; }
        .cont-titles { flex: 1; min-width: 0; }
        .cont-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cont-domain { font-size: 11px; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .notes-input {
            width: 100%; min-height: 96px; resize: vertical;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; padding: 10px 12px;
            color: #fff; font-size: 13px; font-family: inherit; outline: none; line-height: 1.5;
        }
        .notes-input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
        .notes-input::placeholder { color: rgba(255,255,255,0.35); }

        /* Dock & customize (Chrome puts Customize bottom-right) */
        .dock {
            position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 5;
            height: 54px; border-radius: 999px;
            display: flex; align-items: center; gap: 6px; padding: 0 12px;
        }
        .dock-item {
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: background-color 0.15s, transform 0.15s;
        }
        .dock-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .dock-item svg { width: 19px; height: 19px; fill: rgba(255,255,255,0.75); }
        .dock-item:hover svg { fill: #fff; }
        .dock-item.more-dot { color: rgba(255,255,255,0.75); font-size: 16px; letter-spacing: 1px; font-weight: 700; line-height: 1; padding-bottom: 3px; }

        /* Options popup — three-dots menu (font size + tab size) */
        #options-popup {
            position: fixed; bottom: 96px; left: 50%; z-index: 6;
            width: 260px; padding: 16px 18px; border-radius: 16px;
            transform: translateX(-50%) translateY(10px) scale(0.98);
            opacity: 0; pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        #options-popup.open { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
        .opt-title {
            font-size: 10.5px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
            color: rgba(255,255,255,0.45); margin-bottom: 12px;
        }
        .opt-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .opt-row:last-child { margin-bottom: 0; }
        .opt-label { font-size: 12.5px; color: rgba(255,255,255,0.85); }
        .seg { display: flex; gap: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px; }
        .seg button {
            width: 30px; height: 26px; border: none; border-radius: 8px; cursor: pointer;
            background: transparent; color: rgba(255,255,255,0.6); font-size: 11.5px; font-weight: 600;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .seg button:hover { color: #fff; }
        .seg button.on { background: color-mix(in srgb, var(--accent) 30%, transparent); color: #fff; }

        .icon-btn {
            position: fixed; bottom: 18px; right: 18px; z-index: 20;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.15s, border-color 0.2s;
        }
        .icon-btn:hover { transform: rotate(12deg) scale(1.06); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
        body.panel-open .icon-btn { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
        .icon-btn svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.75); }

        /* Chrome-style quick actions: Assistant AI, Incognito, Close */
        #quick-actions {
            position: fixed; top: 16px; right: 16px; z-index: 20;
            display: flex; align-items: center; gap: 10px;
        }
        .qa-btn {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.15s, border-color 0.2s;
        }
        .qa-btn:hover { transform: translateY(-2px) scale(1.06); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
        .qa-btn svg { width: 21px; height: 21px; fill: rgba(255,255,255,0.8); }
        .qa-btn.close:hover { border-color: rgba(255, 107, 129, 0.65); }
        .qa-btn.close:hover svg { fill: #ff6b81; }
        .qa-btn.close:hover { box-shadow: 0 0 14px rgba(255, 107, 129, 0.35); }
        #btn-ai { position: relative; }
        #btn-ai::after {
            content: ''; position: absolute; inset: -5px; border-radius: 50%;
            background: radial-gradient(circle, rgba(56,217,255,0.3), transparent 70%);
            animation: qaPulse 2.6s ease-in-out infinite; z-index: -1;
        }
        @keyframes qaPulse { 0%,100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.14); } }

        /* Weather widget */
        body.widget-off-weather #weather-card { display: none; }
        .weather-main { display: flex; align-items: center; gap: 13px; }
        .weather-emoji { font-size: 36px; line-height: 1; }
        .weather-temp { font-size: 27px; font-weight: 700; color: #fff; line-height: 1; }
        .weather-city { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-top: 3px; }
        .weather-desc { font-size: 12.5px; color: rgba(255,255,255,0.55); }
        .weather-sub { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-top: 2px; }

        #customize-panel {
            position: fixed; bottom: 68px; right: 18px; z-index: 19;
            width: 284px; max-height: calc(100vh - 96px); overflow-y: auto;
            padding: 18px; border-radius: var(--radius-lg);
            display: none;
        }
        body.panel-open #customize-panel { display: block; animation: panelIn 0.22s var(--ease, ease); }
        @keyframes panelIn { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: none; } }
        .cp-head { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
        .cp-section { margin-bottom: 16px; }
        .cp-section > .cp-label {
            display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
            color: rgba(255,255,255,0.45); margin-bottom: 9px;
        }
        #swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .swatch {
            aspect-ratio: 1; border-radius: 10px; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.12s, border-color 0.15s;
            overflow: hidden; position: relative;
        }
        .swatch.wp img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .swatch:hover { transform: scale(1.08); }
        .swatch.active { border-color: #fff; }
        .cp-btn {
            width: 100%; padding: 9px; margin-top: 8px; border-radius: 10px; cursor: pointer;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; font-size: 12.5px;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .cp-btn:hover { background: rgba(255,255,255,0.13); }
        .cp-btn.primary {
            background: color-mix(in srgb, var(--accent) 16%, transparent);
            border-color: color-mix(in srgb, var(--accent) 45%, transparent);
            color: var(--accent); font-weight: 500;
        }
        .cp-btn.danger { color: #ff7d92; border-color: rgba(255,107,129,0.35); }
        .cp-slider-row {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            margin-top: 11px; font-size: 12.5px; color: rgba(255,255,255,0.8);
        }
        .cp-slider-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
        #accents { display: flex; gap: 10px; }
        .accent-dot {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.12s, border-color 0.15s;
        }
        .accent-dot:hover { transform: scale(1.15); }
        .accent-dot.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.18); }
        .cp-input {
            width: 100%; padding: 9px 12px; border-radius: 10px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; font-size: 13px; font-family: inherit; outline: none;
        }
        .cp-input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
        .cp-toggle-row {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.85); cursor: pointer;
        }
        .cp-toggle-row input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

        #editor-overlay {
            position: fixed; inset: 0; z-index: 30; display: none;
            align-items: center; justify-content: center;
            background: rgba(3,5,10,0.6);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        #editor-overlay.open { display: flex; animation: fadeIn 0.18s ease; }

            };
            var done = function (lat, lon) {
                var geo = fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=en')
                    .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
                var w = fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
                    '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m')
                    .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
                Promise.all([geo, w]).then(function (res) {
                    var g = res[0], wj = res[1];
                    if (!wj || !wj.current) { fail(); return; }
                    var d = {
                        code: wj.current.weather_code, t: wj.current.temperature_2m,
                        feels: wj.current.apparent_temperature, wind: wj.current.wind_speed_10m,
                        city: (g && (g.city || g.locality || g.principalSubdivision)) || 'Your location'
                    };
                    try { localStorage.setItem('black_nt_weather', JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
                    paintWeather(d);
                }).catch(fail);
            };
            var viaIp = function () {
                $('weather-city').textContent = 'Locating by IP…';
                fetch('https://ipwho.is')
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (j) {
                        if (!j || typeof j.latitude !== 'number' || typeof j.longitude !== 'number') { fail(); return; }
                        done(j.latitude, j.longitude);
                    })
                    .catch(fail);
            };
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function (p) { done(p.coords.latitude, p.coords.longitude); },
                    function () { viaIp(); },
                    { timeout: 8000, maximumAge: 600000 }
                );
            } else {
                viaIp();
            }
        }

        function renderWeather() {
            if (state.widgets.weather === false) return;
            try {
                var cached = JSON.parse(localStorage.getItem('black_nt_weather') || 'null');
                if (cached && cached.d && Date.now() - cached.t < 600000) { paintWeather(cached.d); return; }
            } catch (e) {}
            loadWeather();
        }

        function applyState() {
            var root = document.documentElement.style;
            root.setProperty('--accent', state.accent);
            root.setProperty('--dim', String(state.dim));
            root.setProperty('--glass-blur', state.blur + 'px');
            root.setProperty('--nt-font', String(state.fontScale || 1));
            root.setProperty('--nt-tab', String(state.tabScale || 1));
            document.body.classList.toggle('aurora', state.aurora && !reduceMotion);
            applyWidgetVisibility();
            var bg = $('bg');
            if (state.bgType === 'image' && state.bgVal) {
                bg.style.backgroundImage = 'url("' + state.bgVal + '")';
            } else {
                bg.style.backgroundImage = GRADIENTS[state.bgIndex][1];
            }
            renderSwatches();
            renderAccents();
            renderDials();
            renderGems();
            renderContinue();
            $('slider-dim').value = Math.round(state.dim * 100);
            $('slider-blur').value = state.blur;
            $('cp-name').value = state.name;
            $('cp-aurora').checked = state.aurora;
            $('cp-aurora').disabled = reduceMotion;
            WIDGETS.forEach(function (key) { $('cp-w-' + key).checked = state.widgets[key] !== false; });
            renderQuote();
            renderWeather();
            updateTime();
            syncSegments();
        }

        function renderSwatches() {
            var wrap = $('swatches');
            wrap.innerHTML = '';
            GRADIENTS.forEach(function (g, i) {
                var d = document.createElement('div');
                d.className = 'swatch' + (state.bgType === 'gradient' && state.bgIndex === i ? ' active' : '');
                d.style.background = g[1];
                d.title = g[0];
                d.addEventListener('click', function () {
                    state.bgType = 'gradient';
                    state.bgIndex = i;
                    applyState();
                    saveState();
                });
                wrap.appendChild(d);
            });
            WALLPAPERS.forEach(function (w) {
                var url = 'black-ui://wallpapers/' + w[1];
                var d = document.createElement('div');
                d.className = 'swatch wp' + (state.bgType === 'image' && state.bgVal === url ? ' active' : '');
                d.title = w[0];
                var img = document.createElement('img');
                img.src = url;
                img.alt = w[0];
                d.appendChild(img);
                d.addEventListener('click', function () {
                    state.bgType = 'image';
                    state.bgVal = url;
                    applyState();
                    saveState();
                });
                wrap.appendChild(d);
            });
        }

        function renderAccents() {
            var wrap = $('accents');
            wrap.innerHTML = '';
            ACCENTS.forEach(function (c) {
                var d = document.createElement('div');
                d.className = 'accent-dot' + (state.accent === c ? ' active' : '');
                d.style.background = c;
                d.title = c;
                d.addEventListener('click', function () {
                    state.accent = c;
                    applyState();
                    saveState();
                });
                wrap.appendChild(d);
            });
        }

        function dailyQuoteIndex() {
            var now = new Date();
            var dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
            return dayOfYear % QUOTES.length;
        }

        function renderQuote() {
            var idx = state.quoteIndex == null ? dailyQuoteIndex() : state.quoteIndex % QUOTES.length;
            var q = QUOTES[idx];
            $('quote-text').textContent = q[0];
            $('quote-author').textContent = q[1] ? '— ' + q[1] : '';
        }

        function updateTime() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            var ampm = h >= 12 ? 'PM' : 'AM';
            var hr = h % 12 || 12;
            $('time').textContent = (hr < 10 ? '0' : '') + hr + ':' + (m < 10 ? '0' : '') + m;
            $('ampm').textContent = ampm;
            $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            var greet = h < 12 ? 'Morning' : (h < 17 ? 'Afternoon' : 'Evening');
            $('greeting-text').textContent = 'Good ' + greet + ', ' + (state.name || 'there');
        }

        function domainOf(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url; }
        }

        function letterOf(name) {
            return (name || '?').charAt(0).toUpperCase();
        }

        function faviconSrc(url) {
            return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domainOf(url)) + '&sz=64';
        }

        function makeFavicon(url, letter, cls) {
            var iconWrap = document.createElement('div');
            iconWrap.className = cls || 'dial-favicon-wrap';
            var letterEl = document.createElement('span');
            letterEl.className = 'dial-letter';
            letterEl.textContent = letterOf(letter || domainOf(url));
            var img = document.createElement('img');
            img.alt = '';
            img.loading = 'lazy';
            img.onerror = function () { this.style.display = 'none'; };
            img.src = faviconSrc(url);
            iconWrap.appendChild(letterEl);
            iconWrap.appendChild(img);
            return iconWrap;
        }

        function renderDials() {
            var wrap = $('speed-dial');
            wrap.innerHTML = '';
            state.dials.forEach(function (d, i) {
                var card = document.createElement('div');
                card.className = 'dial-card';
                card.title = d.url;

                var tile = document.createElement('div');
                tile.className = 'dial-tile';
                var actions = document.createElement('div');
                actions.className = 'dial-actions';
                var ed = document.createElement('button');
                ed.className = 'dial-btn';
                ed.textContent = '✎';
                ed.title = 'Edit';
                ed.addEventListener('click', function (e) {
                    e.stopPropagation();
                    openEditor(i);
                });
                var rm = document.createElement('button');
                rm.className = 'dial-btn' + (pendingRemove === i ? ' rm-pending' : '');
                rm.textContent = pendingRemove === i ? 'Sure?' : '×';
                rm.title = 'Remove';
                rm.addEventListener('click', function (e) {
                    e.stopPropagation();
                    removeDial(i, rm);
                });
                actions.appendChild(ed);
                actions.appendChild(rm);
                tile.appendChild(makeFavicon(d.url, d.name));
                tile.appendChild(actions);

                var name = document.createElement('div');
                name.className = 'dial-name';
                name.textContent = d.name;

                card.appendChild(tile);
                card.appendChild(name);

                card.addEventListener('click', function () {
                    window.location.href = d.url;
                });
                card.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') window.location.href = d.url;
                });
                card.tabIndex = 0;

                card.setAttribute('draggable', 'true');
                card.addEventListener('dragstart', function (e) {
                    dragIndex = i;
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    try { e.dataTransfer.setData('text/plain', 'dial'); } catch (_) {}
                });
                card.addEventListener('dragover', function (e) {
                    if (dragIndex === null) return;
                    e.preventDefault();
                    this.classList.add('drop-target');
                });
                card.addEventListener('dragleave', function () {
                    this.classList.remove('drop-target');
                });
                card.addEventListener('drop', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    this.classList.remove('drop-target');
                    if (dragIndex === null) return;
                    var to = state.dials.indexOf(d);
                    if (to === -1) return;
                    if (dragIndex !== to) {
                        var item = state.dials.splice(dragIndex, 1)[0];
                        state.dials.splice(to, 0, item);
                        saveState();
                    }
                    dragIndex = null;
                    renderDials();
                });
                card.addEventListener('dragend', function () {
                    dragIndex = null;
                    var all = wrap.querySelectorAll('.dial-card.dragging, .dial-card.drop-target');
                    for (var n = 0; n < all.length; n++) {
                        all[n].classList.remove('dragging', 'drop-target');
                    }
                });

                wrap.appendChild(card);
            });
            if (state.dials.length < 8) {
                var add = document.createElement('div');
                add.className = 'dial-card dial-add';
                add.title = 'Add shortcut';
                var addTile = document.createElement('div');
                addTile.className = 'dial-tile';
                var addCircle = document.createElement('div');
                addCircle.className = 'dial-favicon-wrap';
                var plus = document.createElement('span');
                plus.textContent = '+';
                addCircle.appendChild(plus);
                addTile.appendChild(addCircle);
                add.appendChild(addTile);
                add.addEventListener('click', function () { openEditor(null); });
                wrap.appendChild(add);
            }
        }

        function renderGems() {
            var wrap = $('gems-row');
            wrap.innerHTML = '';
            HIDDEN_GEMS.forEach(function (g) {
                var card = document.createElement('div');
                card.className = 'dial-card gem-card';
                card.title = g.blurb;
                var tile = document.createElement('div');
                tile.className = 'dial-tile';
                tile.appendChild(makeFavicon(g.url, g.name));
                var name = document.createElement('div');
                name.className = 'dial-name';
                name.textContent = g.name;
                card.appendChild(tile);
                card.appendChild(name);
                card.addEventListener('click', function () { window.location.href = g.url; });
                card.addEventListener('keydown', function (e) { if (e.key === 'Enter') window.location.href = g.url; });
                card.tabIndex = 0;
                wrap.appendChild(card);
            });
        }

        function renderContinue() {
            var card = $('continue-card');
            var wrap = $('continue-list');
            wrap.innerHTML = '';
            if (!window.api || !window.api.loadHistory) { card.classList.add('no-data'); return; }
            window.api.loadHistory().then(function (hist) {
                if (!Array.isArray(hist) || !hist.length) { card.classList.add('no-data'); return; }
                var seen = {};
                var rows = [];
                for (var i = 0; i < hist.length && rows.length < 6; i++) {
                    var h = hist[i];
                    if (!h || !h.url || seen[h.url] || !/^https?:\/\//.test(h.url)) continue;
                    seen[h.url] = 1;
                    rows.push(h);
                }
                if (!rows.length) { card.classList.add('no-data'); return; }
                card.classList.remove('no-data');
                rows.forEach(function (h) {
                    var row = document.createElement('div');
                    row.className = 'cont-row';
                    var fav = makeFavicon(h.url, h.title || domainOf(h.url), 'cont-fav');
                    var titles = document.createElement('div');
                    titles.className = 'cont-titles';
                    var t = document.createElement('div');
                    t.className = 'cont-title';
                    t.textContent = h.title || domainOf(h.url);
                    var d = document.createElement('div');
                    d.className = 'cont-domain';
                    d.textContent = domainOf(h.url);
                    titles.appendChild(t);
                    titles.appendChild(d);
                    row.appendChild(fav);
                    row.appendChild(titles);
                    row.addEventListener('click', function () { window.location.href = h.url; });
                    row.addEventListener('keydown', function (e) { if (e.key === 'Enter') window.location.href = h.url; });
                    row.tabIndex = 0;
                    wrap.appendChild(row);
                });
            }).catch(function () { card.classList.add('no-data'); });
        }

        function openEditor(index) {
            editingIndex = index === undefined ? null : index;
            $('editor-title').textContent = index === null ? 'Add shortcut' : 'Edit shortcut';
            $('ed-name').value = '';
            $('ed-url').value = '';
            if (index !== null) {
                var d = state.dials[index];
                if (d) {
                    $('ed-name').value = d.name;
                    $('ed-url').value = d.url;
                }
            }
            $('editor-overlay').classList.add('open');
            $('ed-name').focus();
        }

        function closeEditor() {
            $('editor-overlay').classList.remove('open');
            editingIndex = null;
        }

        function saveEditor() {
            var name = $('ed-name').value.trim();
            var url = $('ed-url').value.trim();
            if (!url) { toast('Enter a URL'); return; }
            if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) url = 'https://' + url;
            if (!name) name = domainOf(url);
            var dial = { name: name, url: url, domain: domainOf(url) };
            if (editingIndex !== null && state.dials[editingIndex]) state.dials[editingIndex] = dial;
            else if (state.dials.length >= 8) { toast('Maximum 8 shortcuts'); return; }
            else state.dials.push(dial);
            saveState();
            renderDials();
            closeEditor();
            toast(editingIndex !== null ? 'Shortcut updated' : 'Shortcut added');
        }

        function removeDial(index, btn) {
            if (pendingRemove === index) {
                state.dials.splice(index, 1);
                saveState();
                renderDials();
                pendingRemove = null;
                toast('Shortcut removed');
                return;
            }
            pendingRemove = index;
            btn.textContent = 'Sure?';
            btn.classList.add('rm-pending');
            clearTimeout(pendingRemoveTimer);
            pendingRemoveTimer = setTimeout(function () {
                pendingRemove = null;
                renderDials();
            }, 2500);
        }

        function toast(msg) {
            var t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
        }

        function compressImage(file) {
            return new Promise(function (resolve, reject) {
                var reader = new FileReader();
                reader.onload = function () {
                    var img = new Image();
                    img.onload = function () {
                        var maxW = 1600;
                        var scale = Math.min(1, maxW / img.width);
                        var w = Math.round(img.width * scale);
                        var h = Math.round(img.height * scale);
                        var canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        var ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#121216';
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    };
                    img.onerror = function () { reject(new Error('Bad image')); };
                    img.src = reader.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function startNameEdit() {
            var g = $('greeting');
            var input = document.createElement('input');
            input.value = state.name;
            g.replaceChildren(input);
            input.focus();
            input.select();
            var done = function (save) {
                if (save) {
                    var v = input.value.trim();
                    state.name = v || 'Shiva';
                    saveState();
                    updateTime();
                } else {
                    updateTime();
                }
            };
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { done(true); }
                else if (e.key === 'Escape') { done(false); }
            });
            input.addEventListener('blur', function () { done(true); });
        }

        var searchUrl = 'https://www.google.com/search?q=';
        var engineNames = { google: 'Google', bing: 'Bing', duckduckgo: 'DuckDuckGo' };
        var engineLetters = { google: 'G', bing: 'B', duckduckgo: 'D' };

        function setEngine(engine) {
            var map = {
                google: 'https://www.google.com/search?q=',
                bing: 'https://www.bing.com/search?q=',
                duckduckgo: 'https://duckduckgo.com/?q='
            };
            if (map[engine]) {
                searchUrl = map[engine];
                var input = $('search-input');
                input.placeholder = 'Search ' + (engineNames[engine] || 'the web') + ' or type a URL...';
                $('search-engine').textContent = engineLetters[engine] || 'G';
                $('search-engine').title = engineNames[engine] || 'Search engine';
            }
        }

        if (window.api && window.api.loadSettings) {
            window.api.loadSettings().then(function (s) {
                if (s && s.searchEngine) setEngine(s.searchEngine);
            }).catch(function () {});
        }

        $('search-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                var val = $('search-input').value.trim();
                if (!val) return;
                var url;
                if (/^(https?:\/\/|[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,5}(:[0-9]{1,5})?(\/.*)?$)/i.test(val)) {
                    url = val;
                    if (!url.startsWith('http')) url = 'https://' + url;
                } else {
                    url = searchUrl + encodeURIComponent(val);
                }
                window.location.href = url;
            }
        });

        $('quote-next').addEventListener('click', function () {
            var base = state.quoteIndex == null ? dailyQuoteIndex() : state.quoteIndex;
            state.quoteIndex = (base + 1) % QUOTES.length;
            saveState();
            renderQuote();
        });

        $('quote-text').addEventListener('click', function () {
            var full = $('quote-text').textContent;
            var author = $('quote-author').textContent;
            if (author) full += ' ' + author;
            var done = function () { toast('Quote copied'); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(full).then(done).catch(function () { toast('Copy unavailable'); });
            } else {
                toast('Copy unavailable');
            }
        });

        $('notes-input').addEventListener('input', function () {
            try { localStorage.setItem('black_nt_notes', this.value); } catch (e) {}
        });
        try { $('notes-input').value = localStorage.getItem('black_nt_notes') || ''; } catch (e) {}

        document.querySelectorAll('.dock-item[data-panel]').forEach(function (el) {
            el.addEventListener('click', function () {
                if (window.api && window.api.openPanel) window.api.openPanel(el.dataset.panel);
            });
        });

        $('btn-customize').addEventListener('click', function (e) {
            e.stopPropagation();
            document.body.classList.toggle('panel-open');
        });

        $('btn-ai').addEventListener('click', function () {
            if (window.api && window.api.openPanel) window.api.openPanel('ai');
        });
        $('btn-incognito').addEventListener('click', function () {
            if (window.api && window.api.newWindow) window.api.newWindow(true);
        });
        $('btn-close').addEventListener('click', function () {
            if (window.api && window.api.closeWindow) window.api.closeWindow();
        });
        $('weather-refresh').addEventListener('click', loadWeather);
        document.addEventListener('click', function (e) {
            var panel = $('customize-panel');
            if (document.body.classList.contains('panel-open') &&
                !panel.contains(e.target) && e.target.id !== 'btn-customize') {
                document.body.classList.remove('panel-open');
            }
            var popup = $('options-popup');
            if (popup.classList.contains('open') &&
                !popup.contains(e.target) && e.target.id !== 'btn-options') {
                popup.classList.remove('open');
            }
        });

        $('btn-options').addEventListener('click', function (e) {
            e.stopPropagation();
            $('options-popup').classList.toggle('open');
        });
        function syncSegments() {
            [['seg-font', state.fontScale || 1], ['seg-tab', state.tabScale || 1]].forEach(function (pair) {
                var seg = $(pair[0]);
                seg.querySelectorAll('button').forEach(function (b) {
                    b.classList.toggle('on', Math.abs(parseFloat(b.dataset.v) - pair[1]) < 0.001);
                });
            });
        }
        document.querySelectorAll('#seg-font button, #seg-tab button').forEach(function (b) {
            b.addEventListener('click', function () {
                var segId = b.parentElement.id;
                var v = parseFloat(b.dataset.v);
                if (segId === 'seg-font') { state.fontScale = v; }
                else { state.tabScale = v; }
                applyState();
                saveState();
            });
        });

        $('slider-dim').addEventListener('input', function () {
            state.dim = parseInt(this.value, 10) / 100;
            document.documentElement.style.setProperty('--dim', String(state.dim));
            saveState();
        });
        $('slider-blur').addEventListener('input', function () {
            state.blur = parseInt(this.value, 10);
            document.documentElement.style.setProperty('--glass-blur', state.blur + 'px');
            saveState();
        });
        $('cp-name').addEventListener('input', function () {
            state.name = this.value.trim() || 'Shiva';
            updateTime();
            saveState();
        });
        $('cp-aurora').addEventListener('change', function () {
            state.aurora = this.checked;
            document.body.classList.toggle('aurora', state.aurora && !reduceMotion);
            saveState();
        });
        WIDGETS.forEach(function (key) {
            $('cp-w-' + key).addEventListener('change', function () {
                state.widgets[key] = this.checked;
                saveState();
                applyWidgetVisibility();
            });
        });
        $('btn-reset').addEventListener('click', function () {
            state = {};
            for (var k in DEFAULTS) state[k] = DEFAULTS[k];
            state.dials = DEFAULT_DIALS.slice();
            state.widgets = {};
            for (var w in DEFAULTS.widgets) state.widgets[w] = DEFAULTS.widgets[w];
            saveState();
            applyState();
            toast('Defaults restored');
        });

        $('btn-upload').addEventListener('click', function () { $('file-input').click(); });
        $('file-input').addEventListener('change', function () {
            var f = this.files && this.files[0];
            if (!f) return;
            compressImage(f).then(function (dataUrl) {
                state.bgType = 'image';
                state.bgVal = dataUrl;
                applyState();
                saveState();
                toast('Wallpaper applied');
            }).catch(function () {
                toast('Could not load that image');
            });
            this.value = '';
        });

        $('btn-name-edit').addEventListener('click', startNameEdit);

        $('ed-cancel').addEventListener('click', closeEditor);
        $('ed-save').addEventListener('click', saveEditor);
        $('editor-overlay').addEventListener('click', function (e) {
            if (e.target === this) closeEditor();
        });
        $('ed-url').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') saveEditor();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                if ($('editor-overlay').classList.contains('open')) closeEditor();
                document.body.classList.remove('panel-open');
            }
            if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
                e.preventDefault();
                $('search-input').focus();
            }
            if (e.ctrlKey && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                $('search-input').focus();
            }
        });

        loadState();
        applyState();
        setInterval(updateTime, 1000);
        $('search-input').focus();
    </script>
</body>
</html>
